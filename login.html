<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferwap Music - Artist Access</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display:flex; justify-content:center; align-items:center; min-height:100vh; background-color:#0b0e14; color:#fff; font-family:sans-serif;">

  <div style="background:#131822; border:1px solid #1e2638; border-radius:12px; padding:32px; width:100%; max-width:400px; box-shadow:0 8px 24px rgba(0,0,0,0.4);">
    
    <div style="text-align:center; margin-bottom:24px;">
      <h2 style="color:#00ff88; margin-bottom:8px;">FERWAP MUSIC</h2>
      <p style="color:#828ca0; font-size:14px;">Portal Distribusi Artis</p>
    </div>

    <!-- Pilihan Tab Login / Sign Up -->
    <div style="display:flex; margin-bottom:20px; border-bottom:1px solid #1e2638;">
      <button id="tab-login" onclick="switchMode('login')" style="flex:1; padding:10px; background:none; border:none; color:#00ff88; border-bottom:2px solid #00ff88; cursor:pointer; font-weight:bold;">Masuk (Login)</button>
      <button id="tab-signup" onclick="switchMode('signup')" style="flex:1; padding:10px; background:none; border:none; color:#828ca0; cursor:pointer; font-weight:bold;">Daftar (Sign Up)</button>
    </div>

    <!-- Form Autentikasi -->
    <form id="auth-form" style="display:flex; flex-direction:column; gap:16px;">
      <div id="artist-name-group" style="display:none; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Nama Artis / Stage Name</label>
        <input type="text" id="artist-name" placeholder="Contoh: ANDER" style="background:#0b0e14; border:1px solid #1e2638; padding:12px; border-radius:6px; color:#fff; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Email</label>
        <input type="email" id="auth-email" placeholder="nama@domain.com" required style="background:#0b0e14; border:1px solid #1e2638; padding:12px; border-radius:6px; color:#fff; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Kata Sandi (Password)</label>
        <input type="password" id="auth-password" placeholder="••••••••" required style="background:#0b0e14; border:1px solid #1e2638; padding:12px; border-radius:6px; color:#fff; outline:none;">
      </div>

      <button type="submit" id="btn-submit" style="background:#00ff88; color:#0b0e14; font-weight:bold; padding:12px; border:none; border-radius:6px; cursor:pointer; margin-top:10px;">Masuk ke Portal</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://fvzayaghmxskcvwbllpr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_49UN3oQJiicqsIUj0nPEA_J2HVD1Dn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let mode = 'login';

    function switchMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const nameGroup = document.getElementById('artist-name-group');
      const btnSubmit = document.getElementById('btn-submit');

      if (mode === 'signup') {
        tabSignup.style.color = '#00ff88';
        tabSignup.style.borderBottom = '2px solid #00ff88';
        tabLogin.style.color = '#828ca0';
        tabLogin.style.borderBottom = 'none';
        nameGroup.style.display = 'flex';
        btnSubmit.innerText = 'Daftar Akun Baru';
      } else {
        tabLogin.style.color = '#00ff88';
        tabLogin.style.borderBottom = '2px solid #00ff88';
        tabSignup.style.color = '#828ca0';
        tabSignup.style.borderBottom = 'none';
        nameGroup.style.display = 'none';
        btnSubmit.innerText = 'Masuk ke Portal';
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (mode === 'signup') {
        const artistName = document.getElementById('artist-name').value;
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: { data: { display_name: artistName } }
        });

        if (error) {
          alert("Gagal mendaftar: " + error.message);
        } else {
          alert("Pendaftaran berhasil! Silakan coba login.");
          switchMode('login');
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("Gagal login: " + error.message);
        } else {
          alert("Login berhasil!");
          window.location.href = 'index.html';
        }
      }
    });
  </script>
</body>
</html>
