<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferwap Music - Artist Portal Access</title>
  <!-- Font Awesome untuk Ikon Mata -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display:flex; flex-direction:column; justify-content:space-between; align-items:center; min-height:100vh; margin:0; background-color:#0b0e14; color:#fff; font-family:sans-serif;">

  <!-- HEADER: Logo & Label Name on Left, Support & Feedback on Right -->
  <header style="width:100%; padding:16px 32px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e2638; background:#0b0e14; box-sizing:border-box;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="background:#00ff88; color:#0b0e14; font-weight:bold; width:36px; height:36px; display:flex; justify-content:center; align-items:center; border-radius:8px; font-size:16px;">3H</div>
      <div>
        <h3 style="margin:0; color:#00ff88; font-size:16px; letter-spacing:0.5px;">FERWAP MUSIC</h3>
        <span style="font-size:11px; color:#828ca0;">Official Artist Portal</span>
      </div>
    </div>

    <div style="display:flex; gap:20px; font-size:14px;">
      <a href="mailto:support@ferwap.com" style="color:#828ca0; text-decoration:none; transition:0.2s;" onmouseover="this.style.color='#00ff88'" onmouseout="this.style.color='#828ca0'">Support</a>
      <a href="#feedback" onclick="alert('Please contact admin via email for feedback or technical support.'); return false;" style="color:#828ca0; text-decoration:none; transition:0.2s;" onmouseover="this.style.color='#00ff88'" onmouseout="this.style.color='#828ca0'">Feedback</a>
    </div>
  </header>

  <!-- MAIN AUTH CONTAINER -->
  <div style="background:#131822; border:1px solid #1e2638; border-radius:12px; padding:32px; width:100%; max-width:400px; box-shadow:0 8px 24px rgba(0,0,0,0.4); margin: 20px;">
    
    <div style="text-align:center; margin-bottom:24px;">
      <h2 style="color:#fff; margin-bottom:8px; font-size:20px;">Portal Access</h2>
      <p style="color:#828ca0; font-size:14px;">Sign in or create your artist account</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div style="display:flex; margin-bottom:20px; border-bottom:1px solid #1e2638;">
      <button id="tab-login" onclick="switchMode('login')" style="flex:1; padding:10px; background:none; border:none; color:#00ff88; border-bottom:2px solid #00ff88; cursor:pointer; font-weight:bold;">Sign In</button>
      <button id="tab-signup" onclick="switchMode('signup')" style="flex:1; padding:10px; background:none; border:none; color:#828ca0; cursor:pointer; font-weight:bold;">Sign Up</button>
    </div>

    <!-- Authentication Form -->
    <form id="auth-form" style="display:flex; flex-direction:column; gap:16px;">
      <div id="artist-name-group" style="display:none; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Artist / Stage Name</label>
        <input type="text" id="artist-name" placeholder="e.g. ANDER" style="background:#0b0e14; border:1px solid #1e2638; padding:12px; border-radius:6px; color:#fff; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Email Address</label>
        <input type="email" id="auth-email" placeholder="name@domain.com" required style="background:#0b0e14; border:1px solid #1e2638; padding:12px; border-radius:6px; color:#fff; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="font-size:12px; color:#828ca0;">Password</label>
        <div style="position:relative; display:flex; align-items:center;">
          <input type="password" id="auth-password" placeholder="••••••••" required style="width:100%; background:#0b0e14; border:1px solid #1e2638; padding:12px 40px 12px 12px; border-radius:6px; color:#fff; outline:none; box-sizing:border-box;">
          <i id="toggle-password" class="fa-solid fa-eye" onclick="togglePasswordVisibility()" style="position:absolute; right:12px; color:#828ca0; cursor:pointer;"></i>
        </div>
      </div>

      <button type="submit" id="btn-submit" style="background:#00ff88; color:#0b0e14; font-weight:bold; padding:12px; border:none; border-radius:6px; cursor:pointer; margin-top:10px;">Sign In to Portal</button>
    </form>
  </div>

  <!-- Footer Section -->
    <footer class="site-footer">
        <div class="social-icons">
            <a href="https://www.facebook.com/ferwapmusic" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/ferwapmusic" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="ferwapmusic.info@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
        </div>
        <p class="copyright">&copy; 2026 Ferwap Music Entertainment. All Rights Reserved.</p>
        <div class="footer-links">
            <a href="https://ferwap.com/privacy">Privacy Policy</a> | 
            <a href="https://ferwap.com/terms">Terms of Service</a> | 
            <a href="https://ferwap.com/copyright">Copyright</a>
        </div>
    </footer>

  <script>
    const SUPABASE_URL = 'https://fvzayaghmxskcvwbllpr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_49UN3oQJiicqsIUj0nPEA_J2HVD1Dn';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    let mode = 'login';

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('auth-password');
      const eyeIcon = document.getElementById('toggle-password');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function switchMode(newMode) {
      mode = newMode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const nameGroup = document.getElementById('artist-name-group');
      const btnSubmit = document.getElementById('btn-submit');

      if (mode === 'signup') {
        tabSignup.style.color = '#00ff88';
        tabSignup.style.borderBottom = '2px solid #00ff88';
        tabLogin.style.color = '#828ca0';
        tabLogin.style.borderBottom = 'none';
        nameGroup.style.display = 'flex';
        btnSubmit.innerText = 'Create Account';
      } else {
        tabLogin.style.color = '#00ff88';
        tabLogin.style.borderBottom = '2px solid #00ff88';
        tabSignup.style.color = '#828ca0';
        tabSignup.style.borderBottom = 'none';
        nameGroup.style.display = 'none';
        btnSubmit.innerText = 'Sign In to Portal';
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (mode === 'signup') {
        const artistName = document.getElementById('artist-name').value;
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: { data: { display_name: artistName } }
        });

        if (error) {
          alert("Registration failed: " + error.message);
        } else {
          alert("Registration successful! Please sign in.");
          switchMode('login');
        }
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert("Sign in failed: " + error.message);
        } else {
          alert("Sign in successful!");
          window.location.href = 'index.html';
        }
      }
    });
  </script>
</body>
</html>
